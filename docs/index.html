<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e6b30">
  <meta name="description" content="Records for a small rice and cooking-oil business. Works offline.">
  <title>Bigas at Mantika</title>
  <link rel="icon" href="./assets/images/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">Bigas at Mantika</span>
    <span id="offline" class="offline" hidden>Offline mode, OK</span>
  </header>

  <main id="main" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>

  <nav class="tabs" id="tabs" aria-label="Main">
    <button type="button" data-act="tab" data-tab="orders" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" /><path d="M9 8h6M9 12h6" /></svg>
      <span>Orders</span>
    </button>
    <button type="button" data-act="tab" data-tab="customers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" /><circle cx="17" cy="9" r="2.5" /><path d="M16 14c3 0 5.5 2 5.5 5" /></svg>
      <span>Customers</span>
    </button>
    <button type="button" data-act="tab" data-tab="stock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v10l-9 5-9-5z" /><path d="M3 8l9 5 9-5M12 13v10" /></svg>
      <span>Stock</span>
    </button>
    <button type="button" data-act="tab" data-tab="income">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
      <span>Income</span>
    </button>
    <button type="button" data-act="tab" data-tab="quest">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z" /></svg>
      <span>Quest</span>
    </button>
  </nav>

  <div id="sheets"></div>
  <div id="dialog-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
